name: Package macOS

on:
  workflow_call:

jobs:
  package:
    name: Package macOS
    runs-on: macos-26

    env:
      CONFIGURATION: Release
      QT_VERSION: 6.11.1
      QT_ARCH: clang_64
      PACKAGE_DIR: dist/Release
      DMG_PATH: dist/RunBay-macos-Release.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: daemon/go.sum

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Install DMG packaging tool
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install create-dmg

      - name: Package
        run: ./scripts/package-macos.sh --configuration "$CONFIGURATION" --qt-prefix "$QT_ROOT_DIR"

      - name: Create DMG
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: ./scripts/create-macos-dmg.sh --app "$PACKAGE_DIR/RunBay.app" --output "$DMG_PATH"

      - name: Verify package
        run: |
          codesign --verify --deep --strict "$PACKAGE_DIR/RunBay.app"
          hdiutil verify "$DMG_PATH"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: RunBay-macos-Release
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
